<body>
<x-dc>

<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#7A4B2E}
.icon{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#1F2A2E;text-decoration:none}

.field:focus-within{background:#fff;border-color:#875B3D}
.st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px;border-radius:14px;background:#EFECE6}
.st button{height:46px;border-radius:11px;border:0;background:transparent;font:inherit;font-size:16px;font-weight:600;color:#5B6670;cursor:pointer}
.st button[aria-checked="true"]{background:#fff;color:#1F2A2E;box-shadow:0 1px 3px rgba(31,42,46,0.12),0 1px 1px rgba(31,42,46,0.06)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;background:#875B3D;color:#fff;text-decoration:none;font-family:'Anek Bangla',sans-serif;font-weight:600;font-size:18px;box-shadow:0 1px 2px rgba(94,59,36,0.28),0 8px 20px rgba(135,91,61,0.22)}
.icon:focus-visible,.st button:focus-visible,.cta:focus-visible,a:focus-visible{outline:3px solid #4F7FA6;outline-offset:2px}
</style>
</helmet>

    <div style="flex: 1; text-align: center; font-size: 14px; font-weight: 600; color: #5B6670">পরিচয় · ৩/৩</div>

  <div style="margin: 18px 20px 0; padding: 18px; border-radius: 20px; background: #F6EEE6; box-shadow: inset 0 0 0 2px #875B3D; display: flex; align-items: center; gap: 14px">

    </div>
  </div>

    <div style="display: flex; gap: 8px; align-items: center; font-size: 14.5px; color: #2E6A55; font-weight: 600; padding-left: 4px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg>যাচাইকৃত · স্কুলের রেকর্ডের সাথে মিলেছে

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
