<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>শিক্ষার্থী রিভিউ: বর্ণনামূলক অপশন</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#875B3D}a:hover{color:#654321}
.opt{width:100%;display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;border-radius:16px;border:1px solid transparent;background:#F4F2EE;font:inherit;font-size:17px;font-weight:500;color:#1F2A2E;text-align:left;cursor:pointer}
.opt[aria-checked="true"]{border:2px solid #875B3D;background:#F6EEE6;padding:11px 15px}
.opt:focus-visible,.nav:focus-visible{outline:3px solid #4F7FA6;outline-offset:2px}
.nav{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:15px;text-decoration:none;font-family:'Anek Bangla',sans-serif;font-weight:600;font-size:17px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #FCFBF8; font-family: 'Hind Siliguri', sans-serif; color: #1F2A2E; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #FFFFFF; border-bottom: 1px solid #E7E3DC; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 15px; font-weight: 600">Maryam Binte Rafiq · নার্সারি A</div>
      <div style="font-size: 13px; color: #5B6670">প্রশ্ন ৪/৯</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
      <div style="height: 5px; border-radius: 3px; background: #875B3D"></div>
      <div style="height: 5px; border-radius: 3px; background: #875B3D"></div>
      <div style="height: 5px; border-radius: 3px; background: #875B3D"></div>
      <div style="height: 5px; border-radius: 3px; background: #D9BFA9"></div>
      <div style="height: 5px; border-radius: 3px; background: #EFECE6"></div>
      <div style="height: 5px; border-radius: 3px; background: #EFECE6"></div>
      <div style="height: 5px; border-radius: 3px; background: #EFECE6"></div>
      <div style="height: 5px; border-radius: 3px; background: #EFECE6"></div>
      <div style="height: 5px; border-radius: 3px; background: #EFECE6"></div>
    </div>
    <h1 id="q4" style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.4">নিজে থেকে মোবাইল বা ডিভাইস দেখে কি না?</h1>
  </div>

  <div role="radiogroup" aria-labelledby="q4" style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <button class="opt" role="radio" aria-checked="{{o.sel}}" onClick="{{o.pick}}">
        <span style="flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid {{o.ring}}; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{o.sel}}" hint-placeholder-val="{{false}}"><span style="width: 12px; height: 12px; border-radius: 50%; background: #875B3D"></span></sc-if>
        </span>
        <span>{{o.label}}</span>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E7E3DC; padding: 12px 16px 26px; display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px">
    <a class="nav" href="G2-DayCare.dc.html" style="background: #F4F2EE; color: #1F2A2E; border: 0">আগের</a>
    <a class="nav" href="G2-Review.dc.html" style="background: #875B3D; color: #fff">পরের প্রশ্ন</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: 1 }; }
  renderVals() {
    const O = ['দেখে না', 'সপ্তাহে ২/১ বার', 'সপ্তাহে ৩/৪ বার বা তার বেশি'];
    return {
      opts: O.map((label, i) => ({
        label,
        sel: this.state.picked === i,
        ring: this.state.picked === i ? '#875B3D' : '#A8A096',
        pick: () => this.setState({ picked: i })
      }))
    };
  }
}
</script>
</body>
</html>
