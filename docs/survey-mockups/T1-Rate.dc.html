<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>শিক্ষকের রিভিউ: প্রশ্নভিত্তিক মার্কিং</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.icon{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#1F2A2E;text-decoration:none;cursor:pointer}
.track{flex:none;display:grid;grid-template-columns:repeat(4,40px);gap:2px;padding:3px;border-radius:13px;background:#EFECE6}
.seg{height:44px;border-radius:10px;border:0;background:transparent;font-family:'Anek Bangla',sans-serif;font-weight:600;font-size:19px;color:#3D4A53;cursor:pointer;padding:0}
.seg[aria-checked="true"]{background:#F6EEE6;color:#5E3B24;box-shadow:inset 0 0 0 2px #875B3D}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:0;background:#F6EEE6;color:#7A4B2E;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.cta{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;background:#875B3D;color:#fff;text-decoration:none;font-family:'Anek Bangla',sans-serif;font-weight:600;font-size:18px;box-shadow:0 1px 2px rgba(94,59,36,0.28),0 8px 20px rgba(135,91,61,0.22)}
.sq{width:56px;height:56px;border-radius:18px;background:#EFECE6;display:flex;align-items:center;justify-content:center;color:#1F2A2E;text-decoration:none}
.icon:focus-visible,.seg:focus-visible,.pill:focus-visible,.cta:focus-visible,.sq:focus-visible{outline:3px solid #4F7FA6;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1640px; background: #FCFBF8; font-family: 'Hind Siliguri', sans-serif; color: #1F2A2E; display: flex; flex-direction: column; overflow: hidden">
  <div style="position: sticky; top: 0; z-index: 2; background: rgba(252,251,248,0.94); backdrop-filter: blur(12px); border-bottom: 1px solid #E7E3DC">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; padding: 0 0 0">
      <div style="height: 3px; background: #875B3D"></div><div style="height: 3px; background: #875B3D"></div><div style="height: 3px; background: #D9BFA9"></div><div style="height: 3px; background: #E7E3DC"></div><div style="height: 3px; background: #E7E3DC"></div><div style="height: 3px; background: #E7E3DC"></div><div style="height: 3px; background: #E7E3DC"></div>
    </div>
    <div style="display: flex; align-items: center; padding: 6px 8px 0">
      <a class="icon" href="T1-Class.dc.html" aria-label="ক্লাস বাছাইয়ে ফিরুন"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <div style="flex: 1; text-align: center; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 600">নার্সারি A · কুরআন</span>
        <span style="font-size: 12.5px; color: #2E6A55; font-weight: 600">● সংরক্ষিত</span>
      </div>
      <div style="width: 44px"></div>
    </div>
    <div style="padding: 10px 24px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13.5px; font-weight: 600; color: #875B3D">প্রশ্ন ৩ / ৭</div>
      <h1 id="qtext" style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 21px; line-height: 1.45">অন্য বাচ্চাদের সাথে মারামারি বা বাজে কথা বলে কি না?</h1>
      <div style="display: inline-flex; align-self: flex-start; gap: 7px; align-items: center; padding: 6px 11px; border-radius: 10px; background: #FDF3EA; color: #8A4416; font-size: 14px; font-weight: 600">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"></path></svg>উল্টো স্কেল: ১০ = সমস্যা নেই, ৪ = প্রায়ই
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 24px 6px">
    <span style="font-size: 14px; color: #5B6670">{{total}} জন · রোল অনুযায়ী</span>
    <sc-if value="{{hasRemain}}" hint-placeholder-val="{{true}}"><button class="pill" aria-label="{{remainAria}}">{{remainText}} <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></button></sc-if>
  </div>

  <div style="padding: 0 12px 130px; display: flex; flex-direction: column">
    <sc-for list="{{students}}" as="s" hint-placeholder-count="20">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 68px; padding: 8px 10px 8px 12px; border-bottom: 1px solid #EFECE6">
        <div style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: {{s.dotBg}}; color: {{s.dotFg}}; display: flex; align-items: center; justify-content: center; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 14px">{{s.roll}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span id="{{s.nid}}" style="font-size: 15px; font-weight: 600; line-height: 1.35">{{s.name}}</span>
          <sc-if value="{{s.showId}}" hint-placeholder-val="{{false}}"><span style="font-size: 12.5px; color: #5B6670">আইডি {{s.id}}</span></sc-if>
        </div>
        <div class="track" role="radiogroup" aria-labelledby="{{s.nid}} qtext">
          <sc-for list="{{s.marks}}" as="m" hint-placeholder-count="4"><button class="seg" role="radio" aria-checked="{{m.sel}}" aria-label="{{m.aria}}" onClick="{{m.pick}}">{{m.v}}</button></sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(252,251,248,0.94); border-top: 1px solid #E7E3DC; padding: 12px 20px 28px; display: flex; gap: 10px">
    <a class="sq" href="T1-Class.dc.html" aria-label="আগের প্রশ্ন"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <a class="cta" href="T1-Review.dc.html">পরের প্রশ্ন <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1640}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { marks: { 0: 10, 1: 10, 2: 8, 3: 10, 4: 6, 5: 10, 6: 8, 7: 10, 8: 4, 9: 10, 10: 8, 11: 10 } }; }
  renderVals() {
    const bn = (n) => String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);
    const S = [
      ['Ahmad Shafin Islam', 1, 10011], ['Maryam Binte Rafiq', 2, 10014], ['Abdullah Al Noman', 3, 10019], ['Safiya Rahman', 4, 10022],
      ['Yahya Hasan', 5, 10026], ['Humaira Jannat', 6, 10031], ['Zayan Mahmud', 7, 10037], ['Aisha Siddika Noor', 8, 10040],
      ['Musa Ibn Khalid', 9, 10046], ['Rumaisa Akter', 10, 10052], ['Talha Zubair', 11, 10058], ['Khadija Tul Kubra', 12, 10063],
      ['Ibrahim Hossain', 14, 10069], ['Nusaiba Karim', 15, 10072], ['Omar Faruk Tamim', 16, 10081], ['Sumaya Binte Salam', 17, 10088],
      ['Hamza Rahim', 18, 10093], ['Tasnia Islam', null, 10161], ['Abdur Rahman Fahim', null, 10164], ['Zainab Akter', null, 10166]
    ];
    const marks = this.state.marks;
    const remain = S.length - Object.keys(marks).length;
    return {
      total: bn(S.length), hasRemain: remain > 0,
      remainText: bn(remain) + ' জন বাকি', remainAria: bn(remain) + ' জন বাকি, প্রথম বাকি শিক্ষার্থীর কাছে যান',
      students: S.map(([name, roll, id], i) => ({
        name, nid: 'v2s' + i, roll: roll ? bn(roll) : '–', id: bn(id), showId: !roll,
        dotBg: marks[i] ? '#EFECE6' : '#F6EEE6', dotFg: marks[i] ? '#5B6670' : '#7A4B2E',
        marks: [10, 8, 6, 4].map((v) => ({ v: bn(v), aria: bn(v) + ' মার্ক', sel: marks[i] === v, pick: () => this.setState({ marks: Object.assign({}, marks, { [i]: v }) }) }))
      }))
    };
  }
}
</script>
</body>
</html>
