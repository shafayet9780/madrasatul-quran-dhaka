<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>রিপোর্ট (মোবাইল): শিক্ষার মান</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#875B3D}a:hover{color:#654321}
.card{background:#FFFFFF;border:1px solid #E7E3DC;border-radius:16px;padding:16px}
.h2{margin:0;font-family:'Anek Bangla',sans-serif;font-weight:600;font-size:18px}
.num{font-family:'Anek Bangla',sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.chip{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid transparent;background:#F4F2EE;font:inherit;font-size:14px;font-weight:600;color:#1F2A2E;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#1F2A2E;border-color:#1F2A2E;color:#fff}
.srow{width:100%;display:grid;grid-template-columns:96px minmax(0,1fr) 40px;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:12px;border:1px solid transparent;background:transparent;font:inherit;color:#1F2A2E;text-align:left;cursor:pointer}
.srow[aria-expanded="true"]{border-color:#1F2A2E;background:#F7F5F1}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;text-decoration:none;color:#5B6670;font-size:11.5px;font-weight:600}
.tab[aria-current="page"]{color:#5E3B24}
.chip:focus-visible,.srow:focus-visible,.tab:focus-visible,a:focus-visible{outline:3px solid #4F7FA6;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1700px; background: #F8F7F4; font-family: 'Hind Siliguri', sans-serif; color: #1F2A2E; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E7E3DC; padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 22px">শিক্ষার মান</h1>
      <span style="font-size: 13px; color: #5B6670">G1 · অক্টোবর ২০২৬ · নমুনা ডেটা</span>
    </div>
    <div role="group" aria-label="শ্রেণি" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
      <sc-for list="{{classes}}" as="c" hint-placeholder-count="6"><button class="chip" aria-pressed="{{c.sel}}">{{c.label}}</button></sc-for>
    </div>
  </header>

  <div style="padding: 14px 12px 100px; display: flex; flex-direction: column; gap: 12px">
    <section class="card" style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px"><h2 class="h2">নার্সারি A · বিষয়ভিত্তিক</h2><span style="font-size: 13px; color: #5B6670">১৭ জন অভিভাবক</span></div>
      <sc-for list="{{subjects}}" as="s" hint-placeholder-count="6">
        <button class="srow" aria-expanded="{{s.open}}">
          <span style="font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 4px">
            <sc-if value="{{s.low}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8A4416" stroke-width="2.6" stroke-linejoin="round" aria-label="নিম্ন"><path d="M12 3 2 20h20L12 3z"></path></svg></sc-if>{{s.name}}
          </span>
          <span style="position: relative; height: 14px; display: block">
            <span style="position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: #E7E3DC; display: block"></span>
            <span style="position: absolute; top: 1px; left: {{s.pos}}; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #3A6B5D; box-shadow: 0 0 0 2px #FFFFFF; display: block"></span>
          </span>
          <span class="num" style="text-align: right">{{s.v}}</span>
        </button>
      </sc-for>
      <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px; gap: 10px; padding: 0 10px; font-size: 12.5px; color: #5B6670"><span></span><span style="display: flex; justify-content: space-between"><span>৪</span><span>৭</span><span>১০</span></span><span></span></div>
    </section>

    <section class="card" style="display: flex; flex-direction: column; gap: 12px; border: 2px solid #1F2A2E">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 class="h2">গণিত · প্রশ্নভিত্তিক</h2>
        <span style="font-size: 13px; font-weight: 600; color: #3D4A53">গড় ৬.৪ · ▼ ০.৮</span>
      </div>
      <div style="display: flex; gap: 10px; font-size: 13px; color: #5B6670">
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #B0521A"></span>৪</span>
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #E59A5B"></span>৬</span>
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #8DB4DB"></span>৮</span>
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #2F6FA3"></span>১০</span>
      </div>
      <sc-for list="{{dist}}" as="d" hint-placeholder-count="14">
        <div style="display: flex; flex-direction: column; gap: 5px" title="{{d.tip}}">
          <div style="display: flex; justify-content: space-between; font-size: 13.5px"><span>{{d.n}}. {{d.label}}</span><span class="num">{{d.mean}}</span></div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 14px">
            <div style="display: flex; flex-direction: row-reverse; gap: 2px; padding-right: 1px; border-right: 1px solid #A8A096">
              <div style="height: 14px; background: #E59A5B; width: {{d.w6}}"></div>
              <div style="height: 14px; background: #B0521A; width: {{d.w4}}; border-radius: 4px 0 0 4px"></div>
            </div>
            <div style="display: flex; gap: 2px; padding-left: 1px">
              <div style="height: 14px; background: #8DB4DB; width: {{d.w8}}"></div>
              <div style="height: 14px; background: #2F6FA3; width: {{d.w10}}; border-radius: 0 4px 4px 0"></div>
            </div>
          </div>
        </div>
      </sc-for>
      <a href="R2-Teaching.dc.html" style="font-size: 14px; font-weight: 600">অভিভাবকদের মন্তব্য (৩) →</a>
    </section>
  </div>

  <nav aria-label="রিপোর্ট মেনু" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E7E3DC; padding: 4px 6px 18px; display: flex">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a class="tab" href="{{t.href}}" aria-current="{{t.cur}}">
        <span style="width: 44px; height: 26px; border-radius: 13px; background: {{t.pill}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg></span>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const bn = (n) => String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);
    const TABS = [
      ['ওভারভিউ', 'RM1-Overview.dc.html', 'M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 4v3h6V4z'],
      ['শিক্ষার মান', 'RM2-Teaching.dc.html', 'M4 20V10M10 20V4M16 20v-7M22 20H2'],
      ['ক্লাস', 'RM3-Class.dc.html', 'M3 7l9-4 9 4-9 4zM7 9v5c0 1.5 2.5 3 5 3s5-1.5 5-3V9'],
      ['ট্র্যাকার', 'RM6-Tracker.dc.html', 'M9 11l3 3 8-8M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11'],
      ['আরও', 'R5-Raters.dc.html', 'M5 12h.01M12 12h.01M19 12h.01']
    ];
    const cur = 'RM2-Teaching.dc.html';
    const SUB = [['কুরআন', 8.4], ['আরবি', 7.9], ['ইসলাম শিক্ষা', 8.6], ['বাংলা', 8.1], ['ইংরেজি', 7.6], ['গণিত', 6.4]];
    const Q = ['পড়া বুঝতে পারে', 'ক্লাসে পড়া শেষ হয়', 'হোমওয়ার্কের পরিমাণ', 'ক্লাসে উত্তম আচরণ', 'শিক্ষককে পছন্দ করে', 'কুইজ সিলেবাস রিভাইজ', 'ক্লাস ওয়ার্ক চেক', 'হোমওয়ার্ক চেক', 'লেসন শিখেছে', 'অভিভাবকের সাথে কোর্ডিনেশন', 'পরীক্ষার খাতা চেক', 'আদব-আখলাকে যত্ন', 'সমস্যা জানানো', 'সার্বিক সন্তুষ্টি'];
    const D = [[3, 6, 6, 2], [2, 7, 5, 3], [6, 6, 4, 1], [1, 3, 7, 6], [1, 4, 7, 5], [3, 6, 6, 2], [2, 5, 7, 3], [4, 7, 4, 2], [3, 6, 6, 2], [2, 5, 7, 3], [3, 5, 6, 3], [1, 4, 7, 5], [4, 6, 5, 2], [3, 6, 6, 2]];
    const pct = (c) => Math.round((c / 17) * 100) + '%';
    return {
      tabs: TABS.map(([label, href, icon]) => ({ label, href, icon, cur: href === cur ? 'page' : 'false', pill: href === cur ? '#F6EEE6' : 'transparent' })),
      classes: ['প্লে', 'নার্সারি A', 'নার্সারি B', 'কেজি A', 'কেজি B', 'প্রথম'].map((label, i) => ({ label, sel: i === 1 })),
      subjects: SUB.map(([name, v]) => ({ name, v: bn(v.toFixed(1)), pos: ((v - 4) / 6 * 100).toFixed(1) + '%', low: v < 6.5, open: name === 'গণিত' })),
      dist: Q.map((label, i) => {
        const [a, b, c, d] = D[i];
        return { n: bn(i + 1), label, w4: pct(a), w6: pct(b), w8: pct(c), w10: pct(d), mean: bn(((a * 4 + b * 6 + c * 8 + d * 10) / 17).toFixed(1)),
          tip: label + ': ৪ → ' + bn(a) + ', ৬ → ' + bn(b) + ', ৮ → ' + bn(c) + ', ১০ → ' + bn(d) + ' জন' };
      })
    };
  }
}
</script>
</body>
</html>
