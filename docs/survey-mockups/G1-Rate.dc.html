<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>অভিভাবক রিভিউ: বিষয়ভিত্তিক মার্কিং</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#875B3D}a:hover{color:#654321}
.mk{height:50px;border-radius:12px;border:0;background:transparent;color:#1F2A2E;font-family:'Anek Bangla',sans-serif;font-weight:600;font-size:19px;cursor:pointer;padding:0}
.mk[aria-checked="true"]{background:#F6EEE6;color:#5E3B24;box-shadow:inset 0 0 0 2px #875B3D}
.mk:focus-visible,.nav:focus-visible{outline:3px solid #4F7FA6;outline-offset:2px}
.nav{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:15px;text-decoration:none;font-family:'Anek Bangla',sans-serif;font-weight:600;font-size:17px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; background: #FCFBF8; font-family: 'Hind Siliguri', sans-serif; color: #1F2A2E; display: flex; flex-direction: column; overflow: hidden">
  <div style="position: sticky; top: 0; z-index: 2; background: #FFFFFF; border-bottom: 1px solid #E7E3DC; box-shadow: 0 2px 8px rgba(32,43,48,0.06); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 14px; font-weight: 600">Maryam Binte Rafiq · নার্সারি A</div>
      <div style="font-size: 13px; color: #5B6670">প্রশ্ন ৩/১৪</div>
    </div>
    <div style="height: 6px; border-radius: 3px; background: #EFECE6; overflow: hidden" role="progressbar" aria-valuemin="0" aria-valuemax="14" aria-valuenow="3" aria-label="প্রশ্নের অগ্রগতি">
      <div style="width: 21%; height: 100%; background: #875B3D"></div>
    </div>
    <h1 id="qtext" style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 22px; line-height: 1.45">অতিরিক্ত হোমওয়ার্ক দেওয়া হয় কি না?</h1>
    <div style="align-self: flex-start; display: flex; align-items: center; gap: 6px; background: #FBF1E6; color: #8A4416; border-radius: 10px; padding: 6px 10px; font-size: 14px; font-weight: 600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A4416" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v5h1"></path></svg>
      ১০ = পরিমাণ ঠিক আছে, ৪ = অনেক বেশি
    </div>
  </div>

  <div style="padding: 14px 12px 120px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{subjects}}" as="s" hint-placeholder-count="6">
      <div style="background: #FFFFFF; border: 1px solid {{s.border}}; border-radius: 16px; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <div id="{{s.id}}" style="font-size: 17px; font-weight: 600">{{s.name}}</div>
          <sc-if value="{{s.done}}" hint-placeholder-val="{{false}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E6A55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="সম্পন্ন"><path d="m5 12 5 5 9-10"></path></svg>
          </sc-if>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 14px; background: #EFECE6" role="radiogroup" aria-labelledby="{{s.id}} qtext">
          <sc-for list="{{s.marks}}" as="m" hint-placeholder-count="4">
            <button class="mk" role="radio" aria-checked="{{m.sel}}" aria-label="{{m.aria}}" onClick="{{m.pick}}">{{m.v}}</button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E7E3DC; padding: 12px 16px 26px; display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px">
    <a class="nav" href="G-Match.dc.html" style="background: #F4F2EE; color: #1F2A2E; border: 0">আগের</a>
    <a class="nav" href="G1-Review.dc.html" style="background: #875B3D; color: #fff">{{nextLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { marks: { 0: 10, 1: 8, 2: 10 } }; }
  renderVals() {
    const bn = (n) => String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);
    const S = ['কুরআন', 'আরবি', 'ইসলাম শিক্ষা', 'বাংলা', 'ইংরেজি', 'গণিত'];
    const marks = this.state.marks;
    const left = S.length - Object.keys(marks).length;
    return {
      nextLabel: left ? 'পরের প্রশ্ন (' + bn(left) + 'টি বাকি)' : 'পরের প্রশ্ন →',
      subjects: S.map((name, i) => ({
        name, id: 'sub' + i,
        done: !!marks[i],
        border: marks[i] ? '#E7E3DC' : '#E9D6C3',
        marks: [10, 8, 6, 4].map((v) => ({
          v: bn(v), aria: bn(v) + ' মার্ক',
          sel: marks[i] === v,
          pick: () => this.setState({ marks: Object.assign({}, marks, { [i]: v }) })
        }))
      }))
    };
  }
}
</script>
</body>
</html>
