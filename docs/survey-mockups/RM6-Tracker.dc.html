<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>রিপোর্ট (মোবাইল): রেসপন্স ট্র্যাকার</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#875B3D}a:hover{color:#654321}
.card{background:#FFFFFF;border:1px solid #E7E3DC;border-radius:16px;padding:16px}
.h2{margin:0;font-family:'Anek Bangla',sans-serif;font-weight:600;font-size:18px}
.num{font-family:'Anek Bangla',sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.seg{flex:1;height:40px;border-radius:10px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:#5B6670;cursor:pointer}
.seg[aria-selected="true"]{background:#fff;color:#1F2A2E;box-shadow:0 1px 3px rgba(32,43,48,0.15)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;text-decoration:none;color:#5B6670;font-size:11.5px;font-weight:600}
.tab[aria-current="page"]{color:#5E3B24}
.seg:focus-visible,.tab:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #4F7FA6;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1600px; background: #F8F7F4; font-family: 'Hind Siliguri', sans-serif; color: #1F2A2E; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E7E3DC; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 22px">রেসপন্স ট্র্যাকার</h1>
      <span style="font-size: 13px; color: #5B6670">অক্টোবর ২০২৬ · বন্ধ হতে ১৬ দিন · নমুনা ডেটা</span>
    </div>
    <div role="tablist" aria-label="ট্র্যাকার" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #F0ECE6">
      <button class="seg" role="tab" aria-selected="true">অভিভাবক</button>
      <button class="seg" role="tab" aria-selected="false">শিক্ষক</button>
      <button class="seg" role="tab" aria-selected="false">যাচাই (১৪)</button>
    </div>
  </header>

  <div style="padding: 14px 12px 100px; display: flex; flex-direction: column; gap: 12px">
    <section class="card" style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px"><h2 class="h2">শ্রেণিভিত্তিক সাড়া</h2><span style="font-size: 13px; color: #5B6670">G2 · জমা/মোট</span></div>
      <sc-for list="{{classes}}" as="c" hint-placeholder-count="13">
        <button style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 52px 18px; align-items: center; gap: 8px; min-height: 44px; padding: 4px 8px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.bg}}; font: inherit; color: #1F2A2E; text-align: left; cursor: pointer" aria-expanded="{{c.sel}}">
          <span style="font-weight: 600; font-size: 14px">{{c.cls}}</span>
          <span style="height: 8px; border-radius: 4px; background: #F0ECE6; overflow: hidden; display: block"><span style="display: block; height: 8px; background: #B86A2E; width: {{c.w}}"></span></span>
          <span class="num" style="font-size: 13px; text-align: right">{{c.t}}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B6670" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="{{c.chev}}"></path></svg>
        </button>
        <sc-if value="{{c.sel}}" hint-placeholder-val="{{false}}">
          <div style="margin: 4px 0 8px; padding: 12px; border-radius: 12px; background: #F7F5F1; display: flex; flex-direction: column; gap: 10px">
            <div style="font-size: 13px; font-weight: 600; color: #3D4A53">বাকি ৩ জন</div>
            <sc-for list="{{pending}}" as="p" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 10px">
                <div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">{{p.name}}</span><span style="font-size: 13px; color: #5B6670">{{p.meta}}</span></div>
                <sc-if value="{{p.canCall}}" hint-placeholder-val="{{true}}">
                  <button aria-label="{{p.msgLabel}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2DDD5; background: #fff; display: flex; align-items: center; justify-content: center; color: #1F2A2E; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg></button>
                </sc-if>
                <sc-if value="{{p.canCall}}" hint-placeholder-val="{{true}}">
                  <a href="RM6-Tracker.dc.html" aria-label="{{p.callLabel}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2DDD5; background: #fff; display: flex; align-items: center; justify-content: center; color: #1F2A2E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></a>
                </sc-if>
              </div>
            </sc-for>
            <div style="font-size: 13px; color: #5B6670">প্রত্যেক অভিভাবককে আলাদা বার্তা পাঠান; গ্রুপে নাম তালিকা নয়।</div>
          </div>
        </sc-if>
      </sc-for>
    </section>
  </div>

  <nav aria-label="রিপোর্ট মেনু" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E7E3DC; padding: 4px 6px 18px; display: flex">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a class="tab" href="{{t.href}}" aria-current="{{t.cur}}">
        <span style="width: 44px; height: 26px; border-radius: 13px; background: {{t.pill}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg></span>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    const bn = (n) => String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);
    const TABS = [
      ['ওভারভিউ', 'RM1-Overview.dc.html', 'M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 4v3h6V4z'],
      ['শিক্ষার মান', 'RM2-Teaching.dc.html', 'M4 20V10M10 20V4M16 20v-7M22 20H2'],
      ['ক্লাস', 'RM3-Class.dc.html', 'M3 7l9-4 9 4-9 4zM7 9v5c0 1.5 2.5 3 5 3s5-1.5 5-3V9'],
      ['ট্র্যাকার', 'RM6-Tracker.dc.html', 'M9 11l3 3 8-8M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11'],
      ['আরও', 'R5-Raters.dc.html', 'M5 12h.01M12 12h.01M19 12h.01']
    ];
    const cur = 'RM6-Tracker.dc.html';
    const CLS = ['প্লে', 'নার্সারি A', 'নার্সারি B', 'কেজি A', 'কেজি B', 'প্রথম', 'দ্বিতীয় বালক', 'দ্বিতীয় বালিকা', 'তৃতীয় বালক', 'তৃতীয় বালিকা', 'চতুর্থ', 'পঞ্চম', 'ষষ্ঠ'];
    const TOT = [18, 20, 19, 21, 20, 24, 19, 18, 17, 18, 22, 20, 16];
    const DONE = [16, 17, 14, 17, 14, 22, 15, 15, 11, 14, 21, 15, 12];
    return {
      tabs: TABS.map(([label, href, icon]) => ({ label, href, icon, cur: href === cur ? 'page' : 'false', pill: href === cur ? '#F6EEE6' : 'transparent' })),
      classes: CLS.map((cls, i) => ({ cls, w: Math.round((DONE[i] / TOT[i]) * 100) + '%', t: bn(DONE[i]) + '/' + bn(TOT[i]), sel: i === 1,
        bg: i === 1 ? '#F6EEE6' : '#FFFFFF', border: i === 1 ? '#875B3D' : 'transparent', chev: i === 1 ? 'm6 15 6-6 6 6' : 'm6 9 6 6 6-6' })),
      pending: [
        { name: 'Yahya Hasan', meta: 'রোল ৫ · বাবা ০১৭২০-৪৪১৮৫৩', canCall: true, callLabel: 'Yahya Hasan-এর বাবাকে কল', msgLabel: 'বার্তা কপি করুন' },
        { name: 'Tasnia Islam', meta: 'বাবা ০১৬৮৫-৯৯৩০২১', canCall: true, callLabel: 'Tasnia Islam-এর বাবাকে কল', msgLabel: 'বার্তা কপি করুন' },
        { name: 'Zainab Akter', meta: 'ERP-তে কোনো নম্বর নেই', canCall: false, callLabel: '', msgLabel: 'বার্তা কপি করুন' }
      ]
    };
  }
}
</script>
</body>
</html>
