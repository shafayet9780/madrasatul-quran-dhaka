<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>অভিভাবক রিভিউ: শ্রেণি বাছাই</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.icon{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#1F2A2E;text-decoration:none}
.tile{position:relative;height:76px;border-radius:16px;background:#F4F2EE;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:17px;font-weight:600;color:#1F2A2E;cursor:pointer;padding:0}
.tile[aria-checked="true"]{background:#F6EEE6;border-color:#875B3D;color:#5E3B24}
.badge{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:#875B3D;display:flex;align-items:center;justify-content:center}
.st{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;padding:3px;border-radius:14px;background:#EFECE6}
.st button{height:46px;border-radius:11px;border:0;background:transparent;font:inherit;font-size:16px;font-weight:600;color:#5B6670;cursor:pointer}
.st button[aria-checked="true"]{background:#fff;color:#1F2A2E;box-shadow:0 1px 3px rgba(31,42,46,0.12),0 1px 1px rgba(31,42,46,0.06)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;background:#875B3D;color:#fff;text-decoration:none;font-family:'Anek Bangla',sans-serif;font-weight:600;font-size:18px;box-shadow:0 1px 2px rgba(94,59,36,0.28),0 8px 20px rgba(135,91,61,0.22)}
.icon:focus-visible,.tile:focus-visible,.st button:focus-visible,.cta:focus-visible{outline:3px solid #4F7FA6;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #FCFBF8; font-family: 'Hind Siliguri', sans-serif; color: #1F2A2E; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 3px; background: #E7E3DC"><div style="width: 33%; height: 3px; background: #875B3D"></div></div>
  <div style="display: flex; align-items: center; padding: 8px 8px 0">
    <a class="icon" href="G-Intro.dc.html" aria-label="পিছনে"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <div style="flex: 1; text-align: center; font-size: 14px; font-weight: 600; color: #5B6670">পরিচয় · ১/৩</div>
    <div style="width: 44px"></div>
  </div>

  <div style="padding: 18px 24px 0">
    <h1 id="clsQ" style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.35">আপনার সন্তান কোন শ্রেণিতে পড়ে?</h1>
  </div>

  <div role="radiogroup" aria-labelledby="clsQ" style="padding: 22px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{classes}}" as="c" hint-placeholder-count="9">
      <button class="tile" role="radio" aria-checked="{{c.sel}}" onClick="{{c.pick}}">
        <span>{{c.label}}</span>
        <sc-if value="{{c.hasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 500; color: {{c.subColor}}">{{c.sub}}</span></sc-if>
        <sc-if value="{{c.sel}}" hint-placeholder-val="{{false}}"><span class="badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span></sc-if>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{hasSections}}" hint-placeholder-val="{{true}}">
    <div style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 10px">
      <div id="secQ" style="font-size: 15px; font-weight: 600; color: #3D4A53; padding-left: 4px">শাখা</div>
      <div class="st" role="radiogroup" aria-labelledby="secQ">
        <sc-for list="{{sections}}" as="s" hint-placeholder-count="2"><button role="radio" aria-checked="{{s.sel}}" onClick="{{s.pick}}">{{s.label}}</button></sc-for>
      </div>
    </div>
  </sc-if>

  <div style="margin-top: auto; padding: 16px 20px 30px">
    <a class="cta" href="G-Identify.dc.html">{{ctaLabel}} <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cls: 1, sec: 0 }; }
  renderVals() {
    const C = [
      { label: 'প্লে', secs: [] }, { label: 'নার্সারি', secs: ['শাখা A', 'শাখা B'] }, { label: 'কেজি', secs: ['শাখা A', 'শাখা B'] },
      { label: 'প্রথম', secs: [] }, { label: 'দ্বিতীয়', secs: ['বালক', 'বালিকা'] }, { label: 'তৃতীয়', secs: ['বালক', 'বালিকা'] },
      { label: 'চতুর্থ', secs: [] }, { label: 'পঞ্চম', secs: [] }, { label: 'ষষ্ঠ', secs: [] }
    ];
    const st = this.state;
    const c = C[st.cls];
    return {
      classes: C.map((x, i) => ({ label: x.label, hasSub: x.secs.length > 0, sub: '২ শাখা', subColor: st.cls === i ? '#7A4B2E' : '#5B6670', sel: st.cls === i, pick: () => this.setState({ cls: i, sec: 0 }) })),
      hasSections: c.secs.length > 0,
      sections: c.secs.map((x, i) => ({ label: x, sel: st.sec === i, pick: () => this.setState({ sec: i }) })),
      ctaLabel: c.label + (c.secs.length ? ' · ' + c.secs[st.sec] : '') + ' · চালিয়ে যান'
    };
  }
}
</script>
</body>
</html>
