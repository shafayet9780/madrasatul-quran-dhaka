<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>শিক্ষকের রিভিউ: নাম বাছাই</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600&amp;family=Hind+Siliguri:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#875B3D}a:hover{color:#654321}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:16px;background:#875B3D;color:#fff;text-decoration:none;font-family:'Anek Bangla',sans-serif;font-weight:600;font-size:19px;box-shadow:0 1px 2px rgba(94,59,36,0.28),0 8px 20px rgba(135,91,61,0.22)}
.cta:hover{background:#6E4A31;color:#fff}
.opt{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:14px;border:1px solid transparent;background:#F4F2EE;font:inherit;color:#1F2A2E;text-align:left;cursor:pointer}
.opt[aria-pressed="true"]{border:2px solid #875B3D;background:#F6EEE6;padding:9px 13px}
.opt:focus-visible,.cta:focus-visible,.back:focus-visible{outline:3px solid #4F7FA6;outline-offset:2px}
.back{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#1F2A2E;background:transparent;border:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #FCFBF8; font-family: 'Hind Siliguri', sans-serif; color: #1F2A2E; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 3px; background: #EFECE6"><div style="width: 50%; height: 3px; background: #875B3D"></div></div>
  <div style="display: flex; align-items: center; padding: 8px 8px 0"><a class="back" href="Main.dc.html" aria-label="পিছনে"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><div style="flex: 1; text-align: center; font-size: 14px; font-weight: 600; color: #5B6670">শুরু · ধাপ ১/২</div><div style="width: 44px"></div></div>

  <div style="padding: 10px 20px 0">
    <h1 style="margin: 0; font-family: 'Anek Bangla', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.4">আপনার নাম বাছাই করুন</h1>
  </div>

  <div style="padding: 14px 16px 6px">
    <label for="tsearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">শিক্ষকের নাম খুঁজুন</label>
    <div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 14px; background: #fff; border: 1px solid #EFECE6">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6670" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="tsearch" placeholder="নাম লিখে খুঁজুন" style="flex: 1; border: 0; outline: 0; font: inherit; font-size: 16px; background: transparent; color: #1F2A2E">
    </div>
  </div>

  <div style="flex: 1; overflow: auto; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{teachers}}" as="t" hint-placeholder-count="8">
      <button class="opt" aria-pressed="{{t.sel}}" onClick="{{t.pick}}">
        <div style="flex: none; width: 38px; height: 38px; border-radius: 50%; background: #F4F2EE; color: #5E3B24; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">{{t.initial}}</div>
        <div style="flex: 1; font-size: 16px; font-weight: 500">{{t.name}}</div>
        <sc-if value="{{t.sel}}" hint-placeholder-val="{{false}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#875B3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m8 12 3 3 5-6"></path></svg>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="padding: 10px 16px 28px; background: #FCFBF8; border-top: 1px solid #E7E3DC; display: flex; flex-direction: column; gap: 8px">
    <a href="Survey-States.dc.html" style="align-self: center; font-size: 14px; font-weight: 600; padding: 8px">আমার নাম তালিকায় নেই</a>
    <a class="cta" href="T1-Class.dc.html">পরবর্তী ধাপ</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: 1 }; }
  renderVals() {
    const names = ['মাওলানা আব্দুর রহিম', 'উস্তাযা সুমাইয়া আক্তার', 'হাফেজ মাহমুদুল হাসান', 'নুসরাত জাহান', 'মো. সাইফুল ইসলাম', 'তাসনিম ফারহানা', 'হাফেজ ইমরান হোসেন', 'রুমানা পারভীন', 'মাওলানা জুবায়ের আহমদ'];
    return {
      teachers: names.map((name, i) => ({
        name,
        initial: name.replace(/^(মাওলানা|উস্তাযা|হাফেজ|মো\.)\s*/, '').charAt(0),
        sel: this.state.picked === i,
        pick: () => this.setState({ picked: i })
      }))
    };
  }
}
</script>
</body>
</html>
