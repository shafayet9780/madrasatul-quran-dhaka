<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>QR কোড (নমুনা)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{label}}" style="width: {{px}}; height: {{px}}; box-sizing: border-box; background: #fff; padding: {{pad}}; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); grid-template-rows: repeat(25, minmax(0, 1fr))">
  <sc-for list="{{cells}}" as="c" hint-placeholder-count="625"><span style="background: {{c}}"></span></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":168,"min":80,"max":400,"unit":"px"},"seed":{"editor":"text","default":"KG-017"},"color":{"editor":"color","default":"#1F1A14"},"label":{"editor":null,"default":"QR কোড"},"$preview":{"width":168,"height":168}}'>
class Component extends DCLogic {
  renderVals() {
    const size = this.props.size ?? 168;
    const seed = String(this.props.seed ?? 'KG-017');
    const ink = this.props.color ?? '#1F1A14';
    const N = 25;
    let h = 2166136261;
    for (const ch of seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    const rand = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
    const finder = (r, c) => {
      for (const [r0, c0] of [[0, 0], [0, N - 7], [N - 7, 0]]) {
        const y = r - r0, x = c - c0;
        if (y >= -1 && y <= 7 && x >= -1 && x <= 7) {
          if (y < 0 || x < 0 || y > 6 || x > 6) return 0;
          if (y === 0 || y === 6 || x === 0 || x === 6) return 1;
          return (y >= 2 && y <= 4 && x >= 2 && x <= 4) ? 1 : 0;
        }
      }
      return -1;
    };
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const f = finder(r, c);
      const on = f >= 0 ? f === 1 : (r === 6 || c === 6) ? (r + c) % 2 === 0 : rand() > 0.52;
      cells.push(on ? ink : 'transparent');
    }
    return { px: size + 'px', pad: Math.round(size * 0.06) + 'px', cells, label: this.props.label ?? 'QR কোড' };
  }
}
</script>
</body>
</html>
