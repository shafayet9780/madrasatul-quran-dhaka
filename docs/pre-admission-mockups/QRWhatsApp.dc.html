<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":168,"min":80,"max":400,"unit":"px"},"seed":{"editor":"text","default":"chat.whatsapp.com/mq2027"},"mode":{"editor":"enum","options":["screen","print"],"default":"screen"},"label":{"editor":null,"default":"হোয়াটসঅ্যাপ গ্রুপের QR কোড"},"$preview":{"width":168,"height":168}}'>
class Component extends DCLogic {
  renderVals() {
    const size = this.props.size ?? 168;
    const seed = String(this.props.seed ?? 'chat.whatsapp.com/mq2027');
    const ink = '#171717';
    const N = 25;
    let h = 2166136261;
    for (const ch of seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    const rand = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
    const finder = (r, c) => {
      for (const [r0, c0] of [[0, 0], [0, N - 7], [N - 7, 0]]) {
        const y = r - r0, x = c - c0;
        if (y >= -1 && y <= 7 && x >= -1 && x <= 7) {
          if (y < 0 || x < 0 || y > 6 || x > 6) return 0;
          if (y === 0 || y === 6 || x === 0 || x === 6) return 1;
          return (y >= 2 && y <= 4 && x >= 2 && x <= 4) ? 1 : 0;
        }
      }
      return -1;
    };
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const f = finder(r, c);
      const centre = r >= 9 && r <= 15 && c >= 9 && c <= 15;
      const on = centre ? false : f >= 0 ? f === 1 : (r === 6 || c === 6) ? (r + c) % 2 === 0 : rand() > 0.52;
      cells.push(on ? ink : 'transparent');
    }
    const pad = Math.round(size * 0.06);
    const logo = Math.round((size - 2 * pad) * 7 / N);
    return {
      px: size + 'px',
      pad: pad + 'px',
      cells,
      logoPx: logo + 'px',
      logoPos: Math.round((size - logo) / 2) + 'px',
      logoPad: Math.max(2, Math.round(logo * 0.1)) + 'px',
      logoInk: this.props.mode === 'print' ? '#171717' : '#25D366',
      label: this.props.label ?? 'হোয়াটসঅ্যাপ গ্রুপের QR কোড',
    };
  }
}
</script>
