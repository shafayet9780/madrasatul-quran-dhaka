<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>প্রি-অ্যাডমিশন ২০২৭ · পিতা, উপরোক্ত কোনটিই নয়</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ui{--bg:#fafafa;--surface:#fff;--fg:#171717;--mfg:#525252;--muted:#f5f5f5;--border:#e5e5e5;--input:#d4d4d4;--primary:#7a4d32;--primary-h:#663f28;--pfg:#fff;--ring:rgba(122,77,50,.3);--ok:#15803d;--warn:#b45309;--bad:#dc2626;font-family:'Noto Sans Bengali','Inter',sans-serif;color:var(--fg);background:var(--bg)}
.ui.dark{--bg:#111;--surface:#171717;--fg:#f5f5f5;--mfg:#a3a3a3;--muted:#262626;--border:#2a2a2a;--input:#404040;--primary:#c8946b;--primary-h:#d6a682;--pfg:#1c130d;--ring:rgba(200,148,107,.35);--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
.ui a{color:var(--fg);text-underline-offset:3px}
.lat{font-family:Inter,sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:8px;background:var(--primary);color:var(--pfg) !important;font:inherit;font-size:15px;font-weight:500;text-decoration:none;border:0;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--primary-h)}
.ghost{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:0;background:transparent;color:var(--fg);text-decoration:none;cursor:pointer}
.label{display:block;font-size:14px;font-weight:500;line-height:1.45;margin:0 0 2px;padding:0}
.req{color:var(--bad)}
.desc{font-size:13px;color:var(--mfg);line-height:1.5;margin:0 0 4px}
.c{appearance:none;flex:none;width:18px;height:18px;margin:0;border:1px solid var(--input);border-radius:5px;background:var(--surface);display:grid;place-content:center;cursor:pointer}
.c:checked{background:var(--primary);border-color:var(--primary)}
.c:checked::before{content:"";width:5px;height:9px;border:solid var(--pfg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.c:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.ri{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px;cursor:pointer}
.sec{display:flex;flex-direction:column;gap:20px;padding:24px 0}
.sec-h{margin:0;font-size:16px;font-weight:600}
fieldset{border:0;margin:0;padding:0;min-width:0}
</style>
</helmet>
<div class="ui {{theme}}" style="width: 390px; height: 640px; box-sizing: border-box; display: flex; flex-direction: column; position: relative">
  <header style="height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; padding: 0 4px">
    <a class="ghost" href="UStudent.dc.html" aria-label="আগের ধাপে ফিরুন"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span style="text-align: center; font-size: 15px; font-weight: 600">পিতার তথ্য</span>
    <a class="ghost lat" href="#" style="font-size: 13px; font-weight: 600">EN</a>
  </header>
  <div style="background: var(--surface); padding: 10px 16px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12.5px; color: var(--mfg)">ধাপ ২ / ৬</span>
    <div style="height: 4px; border-radius: 999px; background: var(--muted)"><div style="width: 28%; height: 4px; background: var(--primary); border-radius: 999px"></div></div>
  </div>

  <main style="padding: 8px 16px 120px">
    <section class="sec">
      <h2 class="sec-h">দ্বীনি অনুশীলন</h2>
      <fieldset>
        <legend class="label">আপনার ইসলামী পোশাক (লিবাস) মেনে চলা <span class="req">*</span></legend>
        <p class="desc">একাধিক বাছাই করা যাবে</p>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
            <label class="ri"><input class="c" type="checkbox" checked="{{o.on}}" onChange="{{o.pick}}">{{o.t}}</label>
          </sc-for>
        </div>
        <p aria-live="polite" style="margin: 6px 0 0; min-height: 21px; display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.55; color: var(--mfg)">
          <sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}">
            <svg style="flex: none; margin-top: 3px" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <span>{{note}}</span>
          </sc-if>
        </p>
      </fieldset>
    </section>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--mfg)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>সংরক্ষিত</span>
    <a class="btn" href="UTransport.dc.html">পরবর্তী <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { on: ['loose', 'beard'], note: '' }; }
  renderVals() {
    const opts = [
      { v: 'loose', t: 'ঢিলেঢালা পোশাক' },
      { v: 'ankle', t: 'প্যান্ট গোড়ালির উপরে' },
      { v: 'beard', t: 'দাড়ি' },
      { v: 'none', t: 'উপরোক্ত কোনটিই নয়', only: true },
    ];
    const on = this.state.on;
    return {
      theme: this.props.theme === 'dark' ? 'dark' : '',
      hasNote: !!this.state.note,
      note: this.state.note,
      opts: opts.map((o) => ({
        t: o.t,
        on: on.includes(o.v),
        pick: () => {
          if (on.includes(o.v)) return this.setState({ on: on.filter((x) => x !== o.v), note: '' });
          if (o.only) {
            const cleared = on.length > 0;
            return this.setState({ on: [o.v], note: cleared ? '‘উপরোক্ত কোনটিই নয়’ বাছাই করায় অন্যগুলো বাদ দেওয়া হয়েছে।' : '' });
          }
          const hadNone = on.includes('none');
          this.setState({ on: [...on.filter((x) => x !== 'none'), o.v], note: hadNone ? 'অন্য একটি বাছাই করায় ‘উপরোক্ত কোনটিই নয়’ বাদ দেওয়া হয়েছে।' : '' });
        },
      })),
    };
  }
}
</script>
</body>
</html>
